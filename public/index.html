<!DOCTYPE html>
<html lang="en" style="height: 100%">
    <head>
        <link rel="manifest" href="./manifest.json" />
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="description"
            content="Rain forecast for the next hour on a clock face." />
        <meta
            name="keywords"
            content="Rain weather clock matthew canty rain forecast forecastio forecast.io weatherclock matthewcanty mattcanty bassbytesbikes" />
        <meta name="description"
            content="Rain forecast displayed on a clock face" />
        <meta name="subject" content="Rain Clock" />
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />

        <title>Rain Clock</title>

        <!-- Add to homescreen for Chrome on Android -->
        <meta name="mobile-web-app-capable" content="yes" />
        <link rel="icon" sizes="192x192" href="./favicon.ico" />

        <!-- Add to homescreen for Safari on iOS -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Rain Clock" />
        <link rel="apple-touch-icon-precomposed" href="./favicon.ico" />

        <!-- Tile icon for Win8 (144x144 + tile color) -->
        <meta name="msapplication-TileImage" content="./favicon.ico" />
        <meta name="msapplication-TileColor" content="#3372DF" />

        <link rel="shortcut icon" href="./favicon.png" />

        <script src="main.js" defer></script>

        <style>
            svg {
                font-family: 'HelveticaNeue-Light', 'Helvetica Neue Light', 'Helvetica Neue', Helvetica, Arial,
                    'Lucida Grande', sans-serif;
            }

            #rim {
                fill: none;
                stroke: #c1c7cd;
                stroke-width: 0.004;
            }

            .tick {
                stroke-linecap: round;
            }

            .tick.minor {
                stroke: #c1c7cd;
                stroke-width: 0.006;
            }

            .tick.major {
                stroke: #161616;
                stroke-width: 0.014;
            }

            .second-hand {
                stroke-width: 0.008;
                stroke: #0f62fe;
                stroke-linecap: round;
            }

            .minute-hand {
                stroke: #161616;
                stroke-width: 0.014;
                stroke-linecap: round;
            }

            .hour-hand {
                stroke: #161616;
                stroke-width: 0.024;
                stroke-linecap: round;
            }

            .hands-cover {
                stroke-width: 0.012;
                fill: #fff;
                stroke: #0f62fe;
            }

            .axis {
                fill: none;
            }

            .axis.light {
                stroke: #a6c8ff;
                stroke-width: 0.004;
                stroke-dasharray: 0.006 0.014;
            }

            .axis.moderate {
                stroke: #4589ff;
                stroke-width: 0.005;
                stroke-dasharray: 0.018 0.012;
            }

            .axis.heavy {
                stroke: #0043ce;
                stroke-width: 0.006;
            }

            .axis text {
                font-size: 0.032;
                font-weight: 600;
                fill: #525252;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                height: 100%;
                margin: 0;
                display: flex;
                flex-direction: column;
                -webkit-tap-highlight-color: transparent;
            }
        </style>
    </head>

    <body>
        <main style="display: flex; flex: 1; flex-direction: column">
            <div id="root" style="display: flex; flex: 1"></div>
        </main>
    </body>
</html>
